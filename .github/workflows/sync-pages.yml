name: 同步快照并推送

# 降级路径：没有服务器时用这个。Pages 只读展示，企业微信推送由 Actions 直接发。
# 注意 Actions 的 cron 最小粒度是 5 分钟，且高峰时段会延迟十几分钟，实时性明显不如自建服务。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src/**", "tools/**", "public/**", ".github/workflows/sync-pages.yml"]

concurrency:
  group: sync-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取上游并生成 dist
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
          PUSH_KINDS: ${{ vars.PUSH_KINDS }}
          PUSH_ONLY: ${{ vars.PUSH_ONLY }}
          PUSH_EXCEPT: ${{ vars.PUSH_EXCEPT }}
          PUSH_REGIONS: ${{ vars.PUSH_REGIONS }}
          PUSH_MIN_TIER: ${{ vars.PUSH_MIN_TIER }}
          PUSH_MAX: ${{ vars.PUSH_MAX }}
          BACKFILL_HOURS: ${{ vars.BACKFILL_HOURS }}
        run: node tools/actions-sync.js

      - name: 回写状态文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/db.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): 同步报点快照 $(date -u +%F-%H%M)"
            git push
          else
            echo "状态无变化，跳过提交"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
