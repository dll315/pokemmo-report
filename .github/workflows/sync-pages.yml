name: 同步快照并推送

# ⚠️ 实测：上游 alpha.pokemmotools.org 的 Cloudflare 会拒绝 GitHub Actions 的出口 IP（全站 HTTP 403），
# 所以这条 workflow 在 Actions 上抓不到数据，跑起来会是红的（探针那步会打印 403 证据）。
# 想用 Pages 托管，改走 DEPLOY.md 的 B2：在能连上游的机器上跑 tools/publish-pages.js，
# Pages 用"Deploy from a branch"→ pages 分支根目录。
# 若哪天上游放行 Actions 的 IP，在仓库 Variables 里加 PAGES_VIA_ACTIONS=1 即可恢复本工作流的自动部署。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["src/**", "tools/**", "public/**", ".github/workflows/sync-pages.yml"]

concurrency:
  group: sync-pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    if: vars.PAGES_VIA_ACTIONS == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 上游连通性探针
        run: node tools/probe-upstream.js
        continue-on-error: true

      - name: 抓取上游并生成 dist
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
          PUSH_KINDS: ${{ vars.PUSH_KINDS }}
          PUSH_ONLY: ${{ vars.PUSH_ONLY }}
          PUSH_EXCEPT: ${{ vars.PUSH_EXCEPT }}
          PUSH_REGIONS: ${{ vars.PUSH_REGIONS }}
          PUSH_MIN_TIER: ${{ vars.PUSH_MIN_TIER }}
          PUSH_MAX: ${{ vars.PUSH_MAX }}
          BACKFILL_HOURS: ${{ vars.BACKFILL_HOURS }}
        run: node tools/actions-sync.js

      - name: 回写状态文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/db.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): 同步报点快照 $(date -u +%F-%H%M)"
            git push
          else
            echo "状态无变化，跳过提交"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
